<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img"
 aria-label="Diagrama distancia–tiempo: la radiación observada del M 7,2 queda dentro de 35 km en los primeros 20 s; un frente único a 4,7 km por segundo habría estado a 85–95 km, y esa velocidad cae en la banda prohibida entre la velocidad de Rayleigh y raíz de dos por la velocidad de la onda S.">
<style>
 text{font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif;font-size:12px;fill:#3a4553} .t{font-size:11px;fill:#5a6675} .b{font-weight:700;fill:#182231}
 .ax{stroke:#8a95a3;stroke-width:1.2} .gr{stroke:#e3e8ee;stroke-width:1}
</style>
<rect width="760" height="440" fill="#fbfbf9"/>
<defs>
 <pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d94d3a" stroke-width="1.4" opacity=".45"/></pattern>
 <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d94d3a"/></marker>
</defs>
<line class="gr" x1="70.0" y1="44" x2="70.0" y2="378"/><text class="t" x="70.0" y="394" text-anchor="middle">0</text>
