<line class="gr" x1="374.0" y1="44" x2="374.0" y2="378"/><text class="t" x="374.0" y="394" text-anchor="middle">80</text>
<line class="gr" x1="450.0" y1="44" x2="450.0" y2="378"/><text class="t" x="450.0" y="394" text-anchor="middle">100</text>
<line class="gr" x1="526.0" y1="44" x2="526.0" y2="378"/><text class="t" x="526.0" y="394" text-anchor="middle">120</text>
<line class="gr" x1="602.0" y1="44" x2="602.0" y2="378"/><text class="t" x="602.0" y="394" text-anchor="middle">140</text>
<line class="gr" x1="678.0" y1="44" x2="678.0" y2="378"/><text class="t" x="678.0" y="394" text-anchor="middle">160</text>
<line class="gr" x1="70" y1="378.0" x2="716" y2="378.0"/><text class="t" x="62" y="382.0" text-anchor="end">0</text>
<line class="gr" x1="70" y1="322.3" x2="716" y2="322.3"/><text class="t" x="62" y="326.3" text-anchor="end">6</text>
<line class="gr" x1="70" y1="266.7" x2="716" y2="266.7"/><text class="t" x="62" y="270.7" text-anchor="end">12</text>
<line class="gr" x1="70" y1="211.0" x2="716" y2="211.0"/><text class="t" x="62" y="215.0" text-anchor="end">18</text>
<line class="gr" x1="70" y1="155.3" x2="716" y2="155.3"/><text class="t" x="62" y="159.3" text-anchor="end">24</text>
<line class="gr" x1="70" y1="99.7" x2="716" y2="99.7"/><text class="t" x="62" y="103.7" text-anchor="end">30</text>
<line class="gr" x1="70" y1="44.0" x2="716" y2="44.0"/><text class="t" x="62" y="48.0" text-anchor="end">36</text>
<path d="M70,378 L505.5,44.0 L716,44 L716.0,55.7 Z" fill="url(#hz)"/><path d="M70,378 L505.5,44.0 L716,44 L716.0,55.7 Z" fill="none" stroke="#d94d3a" stroke-width="1" opacity=".6"/>
<line class="ax" x1="70" y1="378" x2="716" y2="378"/><line class="ax" x1="70" y1="378" x2="70" y2="44"/>
<text x="393.0" y="414" text-anchor="middle">distancia desde el hipocentro del M 7,2 (km)</text>
<text transform="translate(22,211.0) rotate(-90)" text-anchor="middle">tiempo desde el origen del M 7,2 (s)</text>
<rect x="70.0" y="192.4" width="133.0" height="185.6" fill="#e39a2b" opacity=".28" stroke="#c77f16" stroke-width="1.2"/>
<text class="b" x="77.6" y="168.4" style="fill:#a8650c">lo que ve el arreglo</text><text class="t" x="77.6" y="183.4">radiación del M 7,2: ≤ 35 km en 20 s</text>
<rect x="594.4" y="44" width="121.6" height="35.3" fill="#e39a2b" opacity=".28" stroke="#c77f16" stroke-width="1.2"/>
<polygon points="648.7,70.3 651.0,76.3 657.3,76.6 652.4,80.5 654.0,86.6 648.7,83.1 643.4,86.6 645.1,80.5 640.2,76.6 646.5,76.3" fill="#182231"/>
<text class="b" x="716.0" y="28" text-anchor="end" style="font-size:11px">M 7,5 · 152 km · 32,2 s</text>
<text class="t" x="716.0" y="41" text-anchor="end" style="font-size:10px">catálogo USGS, línea recta entre epicentros</text>
<line x1="70" y1="378" x2="505.5" y2="44.0" stroke="#5a6675" stroke-width="1.4"/>
<text class="t" x="313.2" y="185.5" text-anchor="middle" transform="rotate(-37.5 313.2 185.5)">c<tspan baseline-shift="sub" font-size="9">R</tspan> = 3,2 km/s</text>
<line x1="70" y1="378" x2="716.0" y2="55.7" stroke="#5a6675" stroke-width="1.4" stroke-dasharray="2 3"/>
<text class="t" x="495.6" y="181.6" text-anchor="middle" transform="rotate(-26.5 495.6 181.6)">√2·β = 4,9 km/s</text>
<line x1="70" y1="378" x2="671.9" y2="79.3" stroke="#d94d3a" stroke-width="1.3" stroke-dasharray="2 4" opacity=".8"/>
<line x1="70" y1="378" x2="648.7" y2="79.3" stroke="#d94d3a" stroke-width="2.2" stroke-dasharray="7 5"/>
<text class="b" x="222.0" y="290.6" style="fill:#d94d3a" transform="rotate(-27.3 222.0 290.6)">frente único hipotético: 152 km / 32,2 s = 4,7 km/s = 1,37 β</text>
<text class="b" x="465.2" y="95.0" style="fill:#d94d3a" text-anchor="middle">banda prohibida</text><text class="t" x="465.2" y="109.0" text-anchor="middle" style="fill:#d94d3a">c<tspan baseline-shift="sub" font-size="9">R</tspan> &lt; V<tspan baseline-shift="sub" font-size="9">r</tspan> &lt; √2·β</text>
<line x1="393.6" y1="211.0" x2="429.6" y2="192.4" stroke="#d94d3a" stroke-width="6" stroke-linecap="round"/>
<path d="M343.6,294.5 Q381.6,266.7 397.6,216.0" fill="none" stroke="#d94d3a" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="b" x="260.0" y="303.8" style="fill:#d94d3a">a los 18–20 s estaría a 85–95 km</text><text class="t" x="260.0" y="317.8">y el arreglo no ve nada allí</text>
<text class="t" x="404.4" y="354.8" text-anchor="middle" style="font-style:italic">hueco: sin radiación</text>
<text class="t" x="716" y="430" text-anchor="end" style="font-size:10px">la línea de puntos es la exigencia sobre la traza cartografiada (158 km → 4,9 km/s)</text>
</svg>
