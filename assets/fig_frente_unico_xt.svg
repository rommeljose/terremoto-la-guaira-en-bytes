<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"
 aria-label="Diagrama distancia–tiempo: la radiación observada del M 7,2 queda dentro de 35 km en los primeros 20 s; un frente único a 4,7 km/s habría estado a 85–94 km, y esa velocidad cae en la banda prohibida entre V_s y raíz de 2 por V_s.">
<style>
 text{font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif;font-size:12px;fill:#3a4553} .t{font-size:11px;fill:#5a6675} .b{font-weight:700;fill:#182231}
 .ax{stroke:#8a95a3;stroke-width:1.2} .gr{stroke:#e3e8ee;stroke-width:1}
</style>
<rect width="760" height="430" fill="#fbfbf9"/>
<defs>
 <pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d94d3a" stroke-width="1.4" opacity=".45"/></pattern>
 <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d94d3a"/></marker>
</defs>
<line class="gr" x1="70.0" y1="40" x2="70.0" y2="370"/><text class="t" x="70.0" y="386" text-anchor="middle">0</text>
<line class="gr" x1="151.2" y1="40" x2="151.2" y2="370"/><text class="t" x="151.2" y="386" text-anchor="middle">20</text>
<line class="gr" x1="232.5" y1="40" x2="232.5" y2="370"/><text class="t" x="232.5" y="386" text-anchor="middle">40</text>
<line class="gr" x1="313.8" y1="40" x2="313.8" y2="370"/><text class="t" x="313.8" y="386" text-anchor="middle">60</text>
<line class="gr" x1="395.0" y1="40" x2="395.0" y2="370"/><text class="t" x="395.0" y="386" text-anchor="middle">80</text>
<line class="gr" x1="476.2" y1="40" x2="476.2" y2="370"/><text class="t" x="476.2" y="386" text-anchor="middle">100</text>
<line class="gr" x1="557.5" y1="40" x2="557.5" y2="370"/><text class="t" x="557.5" y="386" text-anchor="middle">120</text>
<line class="gr" x1="638.8" y1="40" x2="638.8" y2="370"/><text class="t" x="638.8" y="386" text-anchor="middle">140</text>
<line class="gr" x1="720.0" y1="40" x2="720.0" y2="370"/><text class="t" x="720.0" y="386" text-anchor="middle">160</text>
<line class="gr" x1="70" y1="370.0" x2="720" y2="370.0"/><text class="t" x="62" y="374.0" text-anchor="end">0</text>
<line class="gr" x1="70" y1="315.0" x2="720" y2="315.0"/><text class="t" x="62" y="319.0" text-anchor="end">6</text>
<line class="gr" x1="70" y1="260.0" x2="720" y2="260.0"/><text class="t" x="62" y="264.0" text-anchor="end">12</text>
<line class="gr" x1="70" y1="205.0" x2="720" y2="205.0"/><text class="t" x="62" y="209.0" text-anchor="end">18</text>
<line class="gr" x1="70" y1="150.0" x2="720" y2="150.0"/><text class="t" x="62" y="154.0" text-anchor="end">24</text>
<line class="gr" x1="70" y1="95.0" x2="720" y2="95.0"/><text class="t" x="62" y="99.0" text-anchor="end">30</text>
<line class="gr" x1="70" y1="40.0" x2="720" y2="40.0"/><text class="t" x="62" y="44.0" text-anchor="end">36</text>
<path d="M70,370 L596.5,40.0 L720,40 L720.0,81.9 Z" fill="url(#hz)"/><path d="M70,370 L596.5,40.0 L720,40 L720.0,81.9 Z" fill="none" stroke="#d94d3a" stroke-width="1" opacity=".6"/>
<line class="ax" x1="70" y1="370" x2="720" y2="370"/><line class="ax" x1="70" y1="370" x2="70" y2="40"/>
<text x="395.0" y="406" text-anchor="middle">distancia a lo largo del rumbo desde el hipocentro del M 7,2 (km)</text>
<text transform="translate(22,205.0) rotate(-90)" text-anchor="middle">tiempo desde el inicio (s)</text>
<rect x="70.0" y="186.7" width="142.2" height="183.3" fill="#e39a2b" opacity=".28" stroke="#c77f16" stroke-width="1.2"/>
<text class="b" x="78.125" y="162.7" style="fill:#a8650c">lo que ve el arreglo</text><text class="t" x="78.125" y="177.7">radiación del M 7,2: ≤ 35 km en 20 s</text>
<rect x="598.1" y="40" width="121.9" height="36.7" fill="#e39a2b" opacity=".28" stroke="#c77f16" stroke-width="1.2"/>
<polygon points="675.3,67.7 677.5,73.6 683.9,73.9 678.9,77.8 680.6,83.9 675.3,80.5 670.0,83.9 671.7,77.8 666.8,73.9 673.1,73.6" fill="#182231"/>
<text class="b" x="602.2" y="55" style="font-size:11px">M 7,5 · 149 km · 32 s</text>
<line x1="70" y1="370" x2="596.5" y2="40.0" stroke="#5a6675" stroke-width="1.4"/><text class="t" x="586.5" y="54.0" text-anchor="end">V<tspan baseline-shift="sub" font-size="9">s</tspan> = 3,6 km/s</text>
<line x1="70" y1="370" x2="720.0" y2="81.9" stroke="#5a6675" stroke-width="1.4" stroke-dasharray="2 3"/><text class="t" x="716.0" y="101.9" text-anchor="end">√2·V<tspan baseline-shift="sub" font-size="9">s</tspan> = 5,1 km/s</text>
<line x1="70" y1="370" x2="675.3" y2="76.7" stroke="#d94d3a" stroke-width="2.2" stroke-dasharray="7 5"/>
<text class="b" x="232.5" y="282.3" style="fill:#d94d3a" transform="rotate(-25.9 232.5 282.3)">frente único hipotético: 149 km / 32 s = 4,7 km/s ≈ 1,3·V<tspan baseline-shift="sub" font-size="9">s</tspan></text>
<text class="b" x="525.0" y="90.4" style="fill:#d94d3a" text-anchor="middle">banda prohibida</text><text class="t" x="525.0" y="104.4" text-anchor="middle" style="fill:#d94d3a">V<tspan baseline-shift="sub" font-size="9">s</tspan> &lt; V<tspan baseline-shift="sub" font-size="9">r</tspan> &lt; √2·V<tspan baseline-shift="sub" font-size="9">s</tspan></text>
<line x1="410.5" y1="205.0" x2="448.3" y2="186.7" stroke="#d94d3a" stroke-width="6" stroke-linecap="round"/>
<path d="M354.4,287.5 Q395.0,260.0 414.5,210.0" fill="none" stroke="#d94d3a" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="b" x="265.0" y="296.7" style="fill:#d94d3a">a los 18–20 s estaría a 85–94 km</text><text class="t" x="265.0" y="310.7">y el arreglo no ve nada allí</text>
<text class="t" x="415.3" y="347.1" text-anchor="middle" style="font-style:italic">hueco: sin radiación</text>
</svg>
