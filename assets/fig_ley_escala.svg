<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" role="img"
 aria-label="Dos paneles. Arriba, la duración de la fuente contra la magnitud: una franja verde marca la duración que la ley de escala concede a cada magnitud, entre la longitud de ruptura superficial dividida por tres kilómetros por segundo y la longitud en profundidad dividida por dos y medio. Los cuatro subeventos del sismo de Caracas de 1967 caen dentro de la franja; el sismo completo, magnitud 6,6, dura entre 57 y 65 segundos, de cuatro a nueve veces los 7 a 13 segundos que le corresponderían. La radiación del M 7,2 de La Guaira, 20 segundos, cae dentro de la franja, y la envolvente del par, unos 70 segundos, queda poco por encima. Abajo, la secuencia de Caracas 1967 en el tiempo: cuatro pulsos de 6, 9, 4 y 6 segundos separados por huecos sin radiación, repartidos a lo largo de 57 segundos y de 91 kilómetros.">
