<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
  <title id="t">¿Por qué hubo un segundo terremoto?</title>
  <desc id="d">Lámina de anuncio: una falla con dos tramos que rompieron, uno al oeste y otro al este, y en medio un tramo con un signo de interrogación.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140f0e"/><stop offset="1" stop-color="#1c1a2b"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <radialGradient id="hot"><stop offset="0" stop-color="#ff5a3c" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="cold"><stop offset="0" stop-color="#3b8dff" stop-opacity=".45"/><stop offset="1" stop-color="#3b8dff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e6d6c8"/></marker>
  </defs>
  <rect width="760" height="300" rx="14" fill="url(#bg)"/>
  <rect width="760" height="300" rx="14" fill="url(#grid)"/>

  <text x="40" y="52" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f6f1ec">¿Por qué hubo un segundo?</text>
  <text x="40" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#b6a99c" letter-spacing=".12em">EL REPARTO INVISIBLE DEL ESFUERZO · ΔCFS</text>

  <!-- halos: carga en los extremos, sombra en el medio -->
  <ellipse cx="205" cy="172" rx="150" ry="60" fill="url(#hot)"/>
  <ellipse cx="590" cy="150" rx="150" ry="60" fill="url(#hot)"/>
  <ellipse cx="400" cy="120" rx="70" ry="38" fill="url(#cold)"/>
  <ellipse cx="400" cy="205" rx="70" ry="38" fill="url(#cold)"/>

  <!-- la falla: dos tramos que rompieron y el tramo intermedio -->
  <path d="M60 178 L330 164" stroke="#ff7a52" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M330 164 L470 158" stroke="#8d8a9a" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 11"/>
  <path d="M470 158 L720 146" stroke="#ff7a52" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <!-- deslizamiento dextral -->
  <g stroke="#e6d6c8" stroke-width="2" marker-end="url(#ar)" fill="none">
    <line x1="150" y1="150" x2="230" y2="146"/><line x1="240" y1="196" x2="160" y2="200"/>
    <line x1="545" y1="130" x2="625" y2="126"/><line x1="640" y1="176" x2="560" y2="180"/>
  </g>

  <!-- estrellas de los epicentros -->
  <g fill="#ffd166" stroke="#3a2a10" stroke-width="1" filter="url(#glow)">
    <path transform="translate(120,172) scale(1.15)" d="M0 -11L3.2 -3.6 11 -3.4 4.8 1.5 7 9 0 4.6 -7 9 -4.8 1.5 -11 -3.4 -3.2 -3.6z"/>
    <path transform="translate(505,157) scale(1.15)" d="M0 -11L3.2 -3.6 11 -3.4 4.8 1.5 7 9 0 4.6 -7 9 -4.8 1.5 -11 -3.4 -3.2 -3.6z"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="600" fill="#f6f1ec">
    <text x="120" y="228" text-anchor="middle">M 7,2</text>
    <text x="505" y="213" text-anchor="middle">M 7,5 · 30 s después</text>
  </g>

  <!-- el tramo en duda -->
  <g filter="url(#glow)">
    <circle cx="400" cy="161" r="22" fill="#1c1a2b" stroke="#7fc0ff" stroke-width="2"/>
    <text x="400" y="170" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="26" font-weight="700" fill="#7fc0ff" text-anchor="middle">?</text>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#7fc0ff" text-anchor="middle">
    <text x="400" y="100">¿trabado y cargado,</text><text x="400" y="240">o en sombra?</text>
  </g>

  <text x="40" y="276" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#b6a99c">Rojo acerca a romper, azul aleja. Calculado de dos maneras, con la superficie de la Tierra y sin ella.</text>
</svg>
