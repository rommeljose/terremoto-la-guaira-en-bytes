<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img"
 aria-label="Regímenes de velocidad de ruptura de una grieta de cizalla: subshear hasta la velocidad de Rayleigh, banda prohibida hasta raíz de dos por la velocidad de la onda S, supershear estable hasta la velocidad de la onda P; el frente único hipotético de La Guaira, 4,7 kilómetros por segundo, cae dentro de la banda prohibida.">
<style>
 text{font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif;font-size:12px;fill:#3a4553} .t{font-size:11px;fill:#5a6675} .b{font-weight:700;fill:#182231}
</style>
<rect width="760" height="352" fill="#fbfbf9"/>
<defs>
 <pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d94d3a" stroke-width="1.6" opacity=".5"/></pattern>
 <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d94d3a"/></marker>
 <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="none" stroke="#d94d3a" stroke-width="1.2"/></marker>
 <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/></marker>
</defs>
<text class="b" x="60" y="30" style="font-size:14px">¿A qué velocidad puede avanzar una grieta de cizalla?</text>
<text class="t" x="60" y="48">flujo de energía hacia la punta, G, según la velocidad del frente V<tspan baseline-shift="sub" font-size="9">r</tspan> (Burridge 1973; Andrews 1976; Aki y Richards 2002, cap. 11)</text>
<path d="M60.0,138 C195.9,136 302.6,130 369.0,144 C419.1,178 487.1,184 534.9,144 C593.8,120 642.4,126 671.5,144" fill="none" stroke="#2b6cb0" stroke-width="2"/>
<line x1="60" y1="144" x2="671.5" y2="144" stroke="#8a95a3" stroke-width="1" stroke-dasharray="3 3"/>
<text class="t" x="60" y="130" style="fill:#2b6cb0">G &gt; 0: la grieta puede avanzar</text>
<text class="t" x="451.9" y="130" text-anchor="middle" style="fill:#d94d3a">G ≤ 0: habría que meterle energía</text>
<rect x="60.0" y="152" width="309.0" height="50" fill="#2f9e6a" opacity=".22"/>
<rect x="369.0" y="152" width="166.0" height="50" fill="url(#hz)"/>
<rect x="369.0" y="152" width="166.0" height="50" fill="none" stroke="#d94d3a" stroke-width="1.2"/>
<rect x="534.9" y="152" width="136.5" height="50" fill="#2b6cb0" opacity=".2"/>
<rect x="671.5" y="152" width="48.5" height="50" fill="#8a95a3" opacity=".2"/>
<line x1="60" y1="202" x2="720" y2="202" stroke="#8a95a3" stroke-width="1.2"/>
<line x1="60.0" y1="202" x2="60.0" y2="207" stroke="#8a95a3"/><text class="t" x="60.0" y="220" text-anchor="middle">0</text>
<line x1="157.1" y1="202" x2="157.1" y2="207" stroke="#8a95a3"/><text class="t" x="157.1" y="220" text-anchor="middle">1</text>
<line x1="254.1" y1="202" x2="254.1" y2="207" stroke="#8a95a3"/><text class="t" x="254.1" y="220" text-anchor="middle">2</text>
<line x1="351.2" y1="202" x2="351.2" y2="207" stroke="#8a95a3"/><text class="t" x="351.2" y="220" text-anchor="middle">3</text>
<line x1="448.2" y1="202" x2="448.2" y2="207" stroke="#8a95a3"/><text class="t" x="448.2" y="220" text-anchor="middle">4</text>
<line x1="545.3" y1="202" x2="545.3" y2="207" stroke="#8a95a3"/><text class="t" x="545.3" y="220" text-anchor="middle">5</text>
<line x1="642.4" y1="202" x2="642.4" y2="207" stroke="#8a95a3"/><text class="t" x="642.4" y="220" text-anchor="middle">6</text>
<text class="t" x="720" y="138" text-anchor="end" style="fill:#182231">velocidad del frente V<tspan baseline-shift="sub" font-size="9">r</tspan> (km/s)</text>
<line x1="369.0" y1="148" x2="369.0" y2="202" stroke="#182231" stroke-width="1"/><text class="t" x="366.0" y="240" text-anchor="end" style="fill:#182231">c<tspan baseline-shift="sub" font-size="9">R</tspan> = 3,2</text>
<line x1="395.8" y1="148" x2="395.8" y2="202" stroke="#182231" stroke-width="1"/><text class="t" x="399.8" y="240" text-anchor="start" style="fill:#182231">β = 3,5</text>
<line x1="534.9" y1="148" x2="534.9" y2="202" stroke="#182231" stroke-width="1"/><text class="t" x="541.9" y="240" text-anchor="start" style="fill:#182231">√2·β = 4,9</text>
<line x1="671.5" y1="148" x2="671.5" y2="202" stroke="#182231" stroke-width="1"/><text class="t" x="671.5" y="240" text-anchor="middle" style="fill:#182231">α = 6,3</text>
<text class="b" x="214.5" y="182" text-anchor="middle" style="fill:#1f7a50">subshear</text>
<text class="b" x="451.9" y="182" text-anchor="middle" style="fill:#b8321f">banda prohibida</text>
<text class="b" x="603.2" y="182" text-anchor="middle" style="fill:#2b6cb0">supershear</text>
<text class="t" x="695.7" y="182" text-anchor="middle">&gt; α</text>
<path d="M331.8,110 Q457.9,54 579.3,110" fill="none" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<text class="t" x="457.9" y="72" text-anchor="middle" style="fill:#2b6cb0">salto de Andrews: una «grieta hija» nace delante del frente y arranca ya por encima de √2·β</text>
<line x1="519.2" y1="276" x2="519.2" y2="204" stroke="#d94d3a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="537.6" y1="276" x2="537.6" y2="204" stroke="#d94d3a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ao)"/>
<text class="b" x="448.2" y="294" text-anchor="middle" style="fill:#d94d3a">La Guaira, si hubiera sido un solo frente</text>
<text class="t" x="448.2" y="310" text-anchor="middle">línea recta 152 km / 32,2 s = 4,7 km/s = 1,37 β (flecha llena) · sobre la traza 158 km = 4,9 km/s = 1,42 β (flecha hueca)</text>
<text class="t" x="60" y="342" style="font-style:italic">Los terremotos ordinarios corren por debajo de c<tspan baseline-shift="sub" font-size="9">R</tspan>; los supershear documentados, por encima de √2·β. En medio no se observa ninguno.</text>
</svg>
