<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img"
 aria-label="Regímenes de velocidad de ruptura de una grieta de cizalla: subshear hasta la velocidad de Rayleigh, banda prohibida hasta raíz de 2 por V_s, supershear estable hasta V_p; el frente único hipotético de La Guaira, 4,7 km/s, cae dentro de la banda prohibida.">
<style>
 text{font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif;font-size:12px;fill:#3a4553} .t{font-size:11px;fill:#5a6675} .b{font-weight:700;fill:#182231}
</style>
<rect width="760" height="330" fill="#fbfbf9"/>
<defs>
 <pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d94d3a" stroke-width="1.6" opacity=".5"/></pattern>
 <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d94d3a"/></marker>
 <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/></marker>
</defs>
<text class="b" x="60" y="30" style="font-size:14px">¿A qué velocidad puede avanzar una grieta de cizalla?</text>
<text class="t" x="60" y="48">flujo de energía hacia la punta, G, según la velocidad del frente V<tspan baseline-shift="sub" font-size="9">r</tspan> (Burridge 1973; Andrews 1976; Aki y Richards 2002, cap. 11)</text>
<path d="M60.0,136 C210.0,134 320.0,128 391.2,142 C440.0,176 520.0,182 569.1,142 C620.0,118 660.0,124 690.0,142" fill="none" stroke="#2b6cb0" stroke-width="2"/>
<line x1="60" y1="142" x2="690.0" y2="142" stroke="#8a95a3" stroke-width="1" stroke-dasharray="3 3"/>
<text class="t" x="60" y="128" style="fill:#2b6cb0">G &gt; 0: la grieta puede avanzar</text>
<text class="t" x="480.2" y="128" text-anchor="middle" style="fill:#d94d3a">G &lt; 0: habría que meterle energía</text>
<rect x="60.0" y="150" width="331.2" height="50" fill="#2f9e6a" opacity=".22"/>
<rect x="391.2" y="150" width="177.9" height="50" fill="url(#hz)"/>
<rect x="391.2" y="150" width="177.9" height="50" fill="none" stroke="#d94d3a" stroke-width="1.2"/>
<rect x="569.1" y="150" width="120.9" height="50" fill="#2b6cb0" opacity=".2"/>
<rect x="690.0" y="150" width="30.0" height="50" fill="#8a95a3" opacity=".2"/>
<line x1="60" y1="200" x2="720" y2="200" stroke="#8a95a3" stroke-width="1.2"/>
<line x1="60.0" y1="200" x2="60.0" y2="205" stroke="#8a95a3"/><text class="t" x="60.0" y="218" text-anchor="middle">0</text>
<line x1="160.0" y1="200" x2="160.0" y2="205" stroke="#8a95a3"/><text class="t" x="160.0" y="218" text-anchor="middle">1</text>
<line x1="260.0" y1="200" x2="260.0" y2="205" stroke="#8a95a3"/><text class="t" x="260.0" y="218" text-anchor="middle">2</text>
<line x1="360.0" y1="200" x2="360.0" y2="205" stroke="#8a95a3"/><text class="t" x="360.0" y="218" text-anchor="middle">3</text>
<line x1="460.0" y1="200" x2="460.0" y2="205" stroke="#8a95a3"/><text class="t" x="460.0" y="218" text-anchor="middle">4</text>
<line x1="560.0" y1="200" x2="560.0" y2="205" stroke="#8a95a3"/><text class="t" x="560.0" y="218" text-anchor="middle">5</text>
<line x1="660.0" y1="200" x2="660.0" y2="205" stroke="#8a95a3"/><text class="t" x="660.0" y="218" text-anchor="middle">6</text>
<text class="t" x="720" y="234" text-anchor="end">velocidad del frente de ruptura V<tspan baseline-shift="sub" font-size="9">r</tspan> (km/s), con V<tspan baseline-shift="sub" font-size="9">s</tspan> = 3,6 y V<tspan baseline-shift="sub" font-size="9">p</tspan> = 6,3 km/s</text>
<line x1="391.2" y1="146" x2="391.2" y2="200" stroke="#182231" stroke-width="1"/><text class="t" x="388.2" y="250" text-anchor="end" style="fill:#182231">c<tspan baseline-shift="sub" font-size="9">R</tspan> ≈ 0,92·V<tspan baseline-shift="sub" font-size="9">s</tspan></text>
<line x1="420.0" y1="146" x2="420.0" y2="200" stroke="#182231" stroke-width="1"/><text class="t" x="423.0" y="250" text-anchor="start" style="fill:#182231">V<tspan baseline-shift="sub" font-size="9">s</tspan></text>
<line x1="569.1" y1="146" x2="569.1" y2="200" stroke="#182231" stroke-width="1"/><text class="t" x="569.1" y="250" text-anchor="middle" style="fill:#182231">√2·V<tspan baseline-shift="sub" font-size="9">s</tspan></text>
<line x1="690.0" y1="146" x2="690.0" y2="200" stroke="#182231" stroke-width="1"/><text class="t" x="690.0" y="250" text-anchor="middle" style="fill:#182231">V<tspan baseline-shift="sub" font-size="9">p</tspan></text>
<text class="b" x="225.6" y="180" text-anchor="middle" style="fill:#1f7a50">subshear</text>
<text class="b" x="480.2" y="180" text-anchor="middle" style="fill:#b8321f">banda prohibida</text>
<text class="b" x="629.6" y="180" text-anchor="middle" style="fill:#2b6cb0">supershear</text>
<text class="t" x="705.0" y="180" text-anchor="middle">&gt; V<tspan baseline-shift="sub" font-size="9">p</tspan></text>
<path d="M350.0,108 Q480.0,52 595.0,108" fill="none" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<text class="t" x="480.0" y="70" text-anchor="middle" style="fill:#2b6cb0">salto de Andrews: una «grieta hija» nace delante del frente y arranca ya por encima de √2·V<tspan baseline-shift="sub" font-size="9">s</tspan></text>
<line x1="526.0" y1="262" x2="526.0" y2="202" stroke="#d94d3a" stroke-width="2" marker-end="url(#ar)"/>
<text class="b" x="526.0" y="280" text-anchor="middle" style="fill:#d94d3a">La Guaira, si hubiera sido un solo frente: 149 km / 32 s = 4,7 km/s ≈ 1,3·V<tspan baseline-shift="sub" font-size="9">s</tspan></text>
<text class="t" x="526.0" y="296" text-anchor="middle">en plena banda prohibida: no es una velocidad, es un cociente entre dos relojes</text>
<text class="t" x="60" y="318" style="font-style:italic">Los terremotos ordinarios corren por debajo de c<tspan baseline-shift="sub" font-size="9">R</tspan>; los supershear documentados, por encima de √2·V<tspan baseline-shift="sub" font-size="9">s</tspan>. En medio no se observa ninguno.</text>
</svg>
